# Build desta máquina: 4 núcleos, 11 GB de RAM, sem swap.
#
# `jobs` baixo e `codegen-units` limitado não são preferência: com o padrão, o
# `rustc` do kernel (crate grande, `opt-level = 2`) abre dezenas de unidades de
# código em paralelo, estoura a memória e o sistema trava/OOM-mata o build.
#
# Ajuste fino: suba `jobs` só depois de medir. Referência: 2 jobs × 8 unidades
# fica abaixo de ~4 GB de pico.
[build]
jobs = 2
