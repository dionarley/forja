<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forja — PDM</title>
<style>
  :root { color-scheme: dark; --bg:#1b1e22; --panel:#23272c; --line:#333a40; --ink:#f5f2ec; --dim:#9aa1a7; --hot:#2f6f8f; --warm:#b4683a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; }
  aside { width:360px; flex:0 0 360px; border-right:1px solid var(--line); background:var(--panel); padding:14px; overflow:auto; }
  h1 { font-size:16px; margin:0 0 2px; letter-spacing:.02em; }
  h1 span { color:var(--hot); }
  p.sub { margin:0 0 14px; color:var(--dim); font-size:12px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:10px 0 4px; }
  input, select, button { width:100%; padding:7px 9px; border-radius:6px; border:1px solid var(--line); background:#15181c; color:var(--ink); font:inherit; }
  button { margin-top:14px; background:var(--hot); border-color:var(--hot); color:#f5f2ec; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:14px 0 0; font-size:12px; }
  dt { color:var(--dim); }
  dd { margin:0; text-align:right; word-break:break-all; }
  #status { margin-top:12px; font-size:12px; min-height:32px; color:var(--dim); }
  #status.bad { color:var(--warm); }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:12px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  td.n { text-align:right; }
  main { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; }
  #hint { position:absolute; left:14px; bottom:12px; color:var(--dim); font-size:12px; pointer-events:none; }
  #tree { margin-top:12px; border-top:1px solid var(--line); }
  #tree .head { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); padding:8px 4px 2px; }
  #tree .row { display:grid; grid-template-columns:40px 1fr auto; gap:7px; align-items:center; padding:5px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  #tree .row:hover { background:#1b2025; }
  #tree .row.sel { background:#1e2a31; }
  #tree .row img { width:40px; height:28px; object-fit:contain; background:#15181c; border-radius:3px; }
  #tree .row .t b { display:block; font-size:12px; font-weight:600; }
  #tree .row .t small { display:block; color:var(--dim); font-size:11px; }
  #tree .row .q { text-align:right; font-size:11px; color:var(--dim); }
  #tree .row.asm { background:#1d2429; }
</style>
</head>
<body>
<aside>
  <h1>Forja <span>PDM</span></h1>
  <p class="sub">estrutura do <code>.sc</code> nativo · malha do STEP pelo kernel solidcore</p>

  <label for="project">Projeto</label>
  <input id="project" value="PS-001" />
  <label for="item">Item</label>
  <select id="item"><option value="">— carregue o projeto —</option></select>
  <label for="rev">Revisão</label>
  <select id="rev"><option value="">—</option></select>
  <label for="file">Arquivo</label>
  <select id="file"><option value="">— modelos —</option></select>

  <button id="open" disabled>Abrir no serviço</button>
  <div id="status"></div>
  <div id="tree"></div>
  <dl id="info"></dl>
  <table id="bodies"><thead><tr><th>corpo</th><th class="n">faces</th><th class="n">triângulos</th></tr></thead><tbody></tbody></table>
</aside>
<main><canvas id="view"></canvas><div id="hint">arraste: girar · roda: zoom · botão direito: deslocar · clique na peça: abrir</div></main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const status = (text, bad = false) => { const el = $("status"); el.textContent = text; el.classList.toggle("bad", bad); };

// ---------- três ----------
const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111417);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1e6);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xdfe7ee, 0x1a1d20, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(1, 1.6, 1.2); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb4c7, 0.8); fill.position.set(-1.2, 0.4, -0.8); scene.add(fill);

const group = new THREE.Group();
scene.add(group);
const grid = new THREE.GridHelper(200, 20, 0x2b3238, 0x1b2025);
scene.add(grid);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }
}
new ResizeObserver(resize).observe(canvas);
(function loop() { resize(); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

// ---------- API ----------
const api = (path, params) => fetch(path + (params ? "?" + new URLSearchParams(params) : "")).then(async (r) => {
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
});

async function loadProject() {
  const project = $("project").value.trim();
  status("lendo itens do projeto…");
  try {
    const data = await api("/api/items", { project });
    const items = data.items || [];
    $("item").innerHTML = '<option value="">— escolha —</option>' +
      items.map((i) => `<option value="${i.number}">${i.number} — ${i.name || i.item_type}</option>`).join("");
    status(`${items.length} item(ns) em ${project}`);
    const assembly = items.find((i) => i.item_type === "assembly");
    if (assembly) { $("item").value = assembly.number; await loadItem(); }
  } catch (error) { status(error.message, true); }
}

async function loadItem() {
  const number = $("item").value;
  if (!number) return;
  status(`lendo revisões de ${number}…`);
  try {
    const data = await api(`/api/items/${encodeURIComponent(number)}`);
    const revs = (data.revisions || []).map((r) => r.code);
    $("rev").innerHTML = revs.map((c) => `<option value="${c}">${c}</option>`).join("");
    await loadFiles();
  } catch (error) { status(error.message, true); }
}

async function loadFiles() {
  const number = $("item").value, rev = $("rev").value;
  if (!number || !rev) return;
  status(`lendo arquivos de ${number}@${rev}…`);
  try {
    const files = await api(`/api/items/${encodeURIComponent(number)}/revisions/${encodeURIComponent(rev)}/files`);
    const models = files.filter((f) => /^(step|stp|3mf|stl|obj|ply|solidcraft-design)$/i.test(f.format || ""));
    $("file").innerHTML = (models.length ? models : files)
      .map((f) => `<option value="${f.filename}">${f.folder ? f.folder + "/" : ""}${f.filename}</option>`).join("");
    $("open").disabled = !files.length;
    status(`${files.length} arquivo(s); ${models.length} modelo(s)`);
    await loadTree();
  } catch (error) { status(error.message, true); }
}

// ---------- árvore da montagem ----------
let treeTotal = 0;
let assemblyNumber = "";
let assemblyRev = "";

async function loadTree() {
  const number = $("item").value, rev = $("rev").value;
  if (!number || !rev) return;
  try {
    const data = await api("/api/tree", { code: number, rev });
    const tree = data.tree;
    // A peça não tem componentes: a árvore que está na tela continua sendo a
    // da montagem de onde ela veio.
    if (!tree || !tree.parts || !tree.parts.length) return;
    assemblyNumber = number;
    assemblyRev = rev;
    treeTotal = 0;
    const rows = tree.parts.map((p) => {
      const pdm = p.pdm || {};
      const mass = pdm.mass_kg ? (pdm.mass_kg * 1000).toFixed(2) + " g" : "—";
      treeTotal += (pdm.mass_kg || 0) * p.occurrences;
      const thumb = pdm.number
        ? `<img loading="lazy" alt="" src="/api/thumb?code=${encodeURIComponent(pdm.number)}&rev=${encodeURIComponent(pdm.revision || "")}">`
        : "<span></span>";
      return `<div class="row" data-part="${pdm.number || ""}">${thumb}
        <div class="t"><b>${pdm.number || p.name}</b><small>${p.name}${pdm.material ? " · " + pdm.material : ""}</small></div>
        <div class="q">×${p.occurrences}<br>${mass}</div></div>`;
    }).join("");
    $("tree").innerHTML =
      `<div class="head">montagem</div>
       <div class="row asm" data-part="">
         <div class="t"><b>${tree.name}</b><small>${tree.components} definições · ${tree.occurrences} posições · ${data.file.name}</small></div>
         <div class="q">conjunto<br>${(treeTotal * 1000).toFixed(0)} g</div>
       </div>
       <div class="head">peças (${tree.components})</div>${rows}`;
    const selected = tree.parts.find((p) => (p.pdm || {}).number === number);
    if (selected) markRow(number);
  } catch (error) {
    $("tree").innerHTML = `<div class="head">sem árvore: ${error.message}</div>`;
  }
}

function markRow(partNumber) {
  for (const row of $("tree").querySelectorAll(".row")) {
    row.classList.toggle("sel", row.dataset.part === partNumber);
  }
}

async function openPart(number) {
  if (!number) return openAssembly();
  $("item").value = number;
  await loadItem();
  const options = [...$("file").options];
  const step = options.find((o) => /\.step$/i.test(o.value)) || options[0];
  if (!step) return status(`${number}: revisão sem arquivo`, true);
  $("file").value = step.value;
  markRow(number);
  await openModel();
}

// O conjunto: cada peça tessellada uma vez e repetida nas posições do `.sc`.
async function openAssembly() {
  const code = assemblyNumber || $("item").value;
  const rev = assemblyNumber ? assemblyRev : $("rev").value;
  if (!code) return;
  status("montando o conjunto a partir das peças…");
  try {
    const response = await fetch("/api/assembly?" + new URLSearchParams({ code, rev, format: "bin" }));
    if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
    const { positions, indices } = decodeFjpm(await response.arrayBuffer());
    showMesh(positions, indices);
    const detail = await api("/api/assembly", { code, rev });
    const total = detail.parts.reduce((sum, p) => sum + p.occurrences, 0);
    $("info").innerHTML = [
      ["conjunto", `${detail.file.name}@${rev}`],
      ["definições", detail.parts.length],
      ["posições", total],
      ["triângulos", indices.length / 3],
    ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    markRow("");
    status(`montagem: ${detail.parts.length} peças em ${total} posições`);
  } catch (error) { status(error.message, true); }
}

function decodeFjpm(buffer) {
  // FJPM: magic(4) + versão(4) + nPos(4) + nIdx(4) + posições f32 + índices u32
  const magic = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== "FJPM") throw new Error("resposta não é uma malha FJPM");
  const version = new DataView(buffer, 0, 16).getUint32(4, true);
  if (version !== 1) throw new Error(`malha FJPM versão ${version} não suportada`);
  const header = new DataView(buffer, 0, 16);
  const nPos = header.getUint32(8, true), nIdx = header.getUint32(12, true);
  return {
    positions: new Float32Array(buffer, 16, nPos),
    indices: new Uint32Array(buffer, 16 + nPos * 4, nIdx),
  };
}

function params() {
  return {
    source: "teamcraft",
    code: $("item").value,
    rev: $("rev").value,
    file: $("file").value,
  };
}

async function openModel() {
  const p = params();
  if (!p.code || !p.file) return;
  status("abrindo…");
  try {
    const info = await api("/api/open", p);
    fillInfo(info);
    if (!/\.(step|stp)$/i.test(p.file)) {
      status("este visualizador desenha STEP; a estrutura e a miniatura estão na árvore", false);
      return;
    }
    status("tesselando com o solidcore…");
    const response = await fetch("/api/mesh?" + new URLSearchParams({ ...p, format: "bin" }));
    if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
    const { positions, indices } = decodeFjpm(await response.arrayBuffer());
    showMesh(positions, indices);
    const details = await api("/api/mesh", p);
    fillKernel(details.kernel, details.cached);
  } catch (error) { status(error.message, true); }
}

// ---------- cena ----------
function fit(box) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  group.position.set(-center.x, -center.y, -center.z);
  grid.position.y = -box.max.y;
  grid.scale.setScalar(size / 100);
  camera.position.copy(center).add(new THREE.Vector3(size * 0.9, size * 0.75, size * 0.9));
  camera.near = size / 1000;
  camera.far = size * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function showMesh(positions, indices) {
  while (group.children.length) {
    const child = group.children.pop();
    child.geometry.dispose();
    child.material.dispose();
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setIndex(new THREE.BufferAttribute(indices, 1));
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  const material = new THREE.MeshStandardMaterial({
    color: 0xb9c2c9, metalness: 0.25, roughness: 0.55, flatShading: false, side: THREE.DoubleSide,
  });
  group.add(new THREE.Mesh(geometry, material));
  const wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(geometry),
    new THREE.LineBasicMaterial({ color: 0x2f3a42, transparent: true, opacity: 0.5 }),
  );
  wire.visible = false;
  group.add(wire);
  fit(geometry.boundingBox);
  status(`malha pronta: ${indices.length / 3} triângulos`);
}

// ---------- painel ----------
function fillInfo(info) {
  const f = info.file || {}, a = (info.metadata && info.metadata.attributes) || {};
  const s = (info.metadata && info.metadata.structure) || {};
  const rows = [
    ["referência", f.reference], ["handler", info.handler], ["bytes", f.bytes],
    ["sha256", (f.sha256 || "").slice(0, 16)], ["origem (CAD)", a.originating_system],
    ["esquema", a.schema], ["unidades", a.units || s.units],
    ["componentes", s.components], ["posições", s.occurrences],
  ].filter(([, v]) => v !== undefined && v !== null && v !== "");
  $("info").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

function fillKernel(kernel, cached) {
  const rows = [
    ["corpos", kernel.bodies.length], ["faces", kernel.faces], ["triângulos", kernel.triangles],
    ["vértices", kernel.vertices], ["diagonal (mm)", kernel.size_mm && kernel.size_mm.toFixed(2)],
    ["volume (cm³)", kernel.bodies.reduce((sum, b) => sum + (b.volume_mm3 || 0), 0) / 1000],
    ["kernel", `${kernel.elapsed_ms} ms${cached ? " (cache)" : ""}`],
  ].filter(([, v]) => v !== undefined && v !== null);
  const bounds = kernel.bounds;
  if (bounds) rows.push(["faixa (mm)", bounds.min.map((n) => n.toFixed(1)).join(" · ")]);
  $("info").innerHTML += rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("bodies").querySelector("tbody").innerHTML = kernel.bodies
    .map((b) => `<tr><td title="${b.name}">${b.name.slice(0, 18)}</td><td class="n">${b.faces}</td><td class="n">${b.triangles}</td></tr>`)
    .join("");
  if (kernel.failures.length) status(`${kernel.failures.length} corpo(s) recusado(s): ${kernel.failures[0]}`, true);
}

$("project").addEventListener("change", loadProject);
$("item").addEventListener("change", loadItem);
$("rev").addEventListener("change", loadFiles);
$("open").addEventListener("click", openModel);
$("tree").addEventListener("click", (event) => {
  const row = event.target.closest(".row");
  if (row) openPart(row.dataset.part);
});
loadProject();
</script>
</body>
</html>
